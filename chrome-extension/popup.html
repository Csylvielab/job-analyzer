<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobAnalyzer AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">JobAnalyzer AI</span>
      </div>
      <div class="status-indicator" id="status-indicator" title="后端连接状态">
        <span class="status-dot"></span>
        <span class="status-text">检测中...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- 快捷入口 -->
      <section class="quick-actions">
        <button class="action-btn primary" id="btn-analyze-current">
          <span class="action-icon">🔍</span>
          <span class="action-label">分析当前页面</span>
        </button>
        <button class="action-btn" id="btn-open-settings">
          <span class="action-icon">⚙️</span>
          <span class="action-label">设置</span>
        </button>
      </section>

      <!-- 状态消息 -->
      <div class="status-message" id="status-message" style="display: none;"></div>

      <!-- 快捷入口说明 -->
      <section class="tips">
        <h4>💡 使用说明</h4>
        <ul>
          <li>在 Boss直聘 打开职位详情页</li>
          <li>点击「AI 深度分析」按钮</li>
          <li>查看职位分析、关键词、避雷预警</li>
        </ul>
      </section>

      <!-- 历史记录 (可选) -->
      <section class="recent-analysis" id="recent-section" style="display: none;">
        <h4>📜 最近分析</h4>
        <div class="recent-list" id="recent-list"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>v1.0.0</span>
      <span>·</span>
      <a href="#" id="link-feedback">反馈问题</a>
    </footer>

    <!-- Settings Panel (隐藏) -->
    <div class="settings-panel" id="settings-panel" style="display: none;">
      <div class="settings-header">
        <h3>⚙️ 设置</h3>
        <button class="btn-close" id="btn-close-settings">&times;</button>
      </div>
      <div class="settings-body">
        <div class="form-group">
          <label for="input-api-endpoint">后端 API 地址</label>
          <input type="text" id="input-api-endpoint" placeholder="http://127.0.0.1:8000/analyze">
          <p class="form-hint">确保后端服务已启动并监听此地址</p>
        </div>
        <div class="form-actions">
          <button class="btn-secondary" id="btn-reset-settings">恢复默认</button>
          <button class="btn-primary" id="btn-save-settings">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
